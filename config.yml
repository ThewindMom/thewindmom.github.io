baseURL: "https://thewindmom.github.io/"
title: "thewind"
theme: PaperMod

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "thewind"
  description: "Building in public. Writing about AI, engineering, and the journey."
  keywords: [Blog, AI, Machine Learning, Engineering, Tech]
  author: "thewind"

  defaultTheme: dark
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  UseHugoToc: false
  disableSpecial1stPost: true
  disableScrollToTop: true
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  hideFooter: true

  assets:
    disableHLJS: true
    theme_color: "#0B0B0B"
    msapplication_TileColor: "#0B0B0B"
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

menu:
  main:
    - identifier: posts
      name: Essays
      url: /posts/
      weight: 10

outputs:
  home:
    - HTML
    - RSS
