<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0B0B0B"/>
  <circle cx="16" cy="16" r="13" fill="none" stroke="#e8e8e8" stroke-width="0.8" opacity="0.5"/>
  <!-- tw monogram: solid strokes (dots abstracted for favicon legibility) -->
  <g fill="none" stroke="#e8e8e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- lowercase t: vertical stem + crossbar -->
    <path d="M10 10 L10 21"/>
    <path d="M7.5 11 L12.5 11"/>
    <!-- lowercase w: 3 full strokes + partial 4th that dissolves -->
    <path d="M13.5 15 L15.5 21 L17.5 16.5 L19.5 21 L20.7 17.4"/>
  </g>
  <!-- dissolving particles: w's right stroke breaks into a fan -->
  <g fill="#e8e8e8">
    <circle cx="21.2" cy="15.5" r="1.1"/>
    <circle cx="21.8" cy="13.5" r="0.95"/>
    <circle cx="22.3" cy="11.5" r="0.8"/>
    <circle cx="23.0" cy="10.0" r="0.7"/>
    <circle cx="24.0" cy="12.0" r="0.55"/>
    <circle cx="23.8" cy="8.5"  r="0.6"/>
    <circle cx="24.8" cy="10.0" r="0.45"/>
    <circle cx="24.3" cy="7.0"  r="0.5"/>
  </g>
</svg>
