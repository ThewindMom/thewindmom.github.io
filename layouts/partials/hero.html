{{- /* Particle hero: "thewind" as wind-scattered particles on canvas */ -}}
<section class="particle-hero" id="particle-hero" aria-label="Site title">
    <canvas id="hero-canvas" aria-hidden="true"></canvas>
    <div class="particle-hero__content">
        <h1 class="particle-hero__title" id="hero-title">thewind</h1>
    </div>
</section>
<script>
(function () {
    var hero = document.getElementById('particle-hero');
    if (!hero) return;

    var canvas = document.getElementById('hero-canvas');
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    var W, H;
    var particles = [];
    var stars = [];
    var mouse = { x: -9999, y: -9999, active: false };
    var textPoints = [];
    var fontSize = 120;
    var driftScale = 1.0;
    var titleEl = document.getElementById('hero-title');

    // Monochrome palette — white particles on void black
    var WHITE = [255, 255, 255];
    // Slate tint for scattered edge particles — blends into the #2B4559 glow
    var SLATE = [43, 69, 89];

    function resize() {
        W = hero.clientWidth;
        H = hero.clientHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        sampleText();
        initStars();
    }

    function sampleText() {
        if (!titleEl) return;

        var off = document.createElement('canvas');
        off.width = W;
        off.height = H;
        var octx = off.getContext('2d');

        fontSize = Math.min(W * 0.14, 120);
        // On mobile, left-align text to match content padding
        var isMobile = W < 640;
        var padLeft = isMobile ? 20 : W * 0.08;
        octx.font = '600 ' + fontSize + 'px "Geist", sans-serif';
        octx.textAlign = isMobile ? 'left' : 'center';
        octx.textBaseline = 'middle';
        octx.fillStyle = '#fff';
        var textX = isMobile ? padLeft : W / 2;
        octx.fillText('thewind', textX, H * 0.40);

        var imgData = octx.getImageData(0, 0, W, H);
        var data = imgData.data;
        var gap = Math.max(3, Math.round(fontSize / 28));
        textPoints = [];
        for (var y = 0; y < H; y += gap) {
            for (var x = 0; x < W; x += gap) {
                var idx = (y * W + x) * 4;
                if (data[idx + 3] > 128) {
                    textPoints.push({ x: x, y: y });
                }
            }
        }

        particles = [];
        for (var i = 0; i < textPoints.length; i++) {
            var tp = textPoints[i];
            var rightFactor = (tp.x / W);
            var scatter = rightFactor * rightFactor;
        driftScale = fontSize / 120;

            particles.push({
                homeX: tp.x,
                homeY: tp.y,
                x: tp.x + (Math.random() - 0.5) * W,
                y: tp.y + (Math.random() - 0.5) * H * 0.5,
                vx: 0,
                vy: 0,
                size: Math.random() * 1.5 + 1,
                scatter: scatter,
                alpha: 1,
                phase: Math.random() * Math.PI * 2
            });
        }
    }

    function initStars() {
        stars = [];
        var count = Math.floor((W * H) / 5000);
        for (var i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                size: Math.random() * 1.5 + 0.4,
                twinkle: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.025 + 0.008
            });
        }
    }

    var t = 0;
    function draw() {
        t += 1;

        // Clear transparent — page gradient shows through
        ctx.clearRect(0, 0, W, H);

        // Stars
        for (var s = 0; s < stars.length; s++) {
            var star = stars[s];
            star.twinkle += star.speed;
            var a = 0.3 + Math.sin(star.twinkle) * 0.3;
            ctx.fillStyle = 'rgba(255, 255, 255, ' + a + ')';
            ctx.fillRect(star.x, star.y, star.size + 0.5, star.size + 0.5);
        }

        // Particles forming text
        for (var i = 0; i < particles.length; i++) {
            var p = particles[i];

            var dx = p.homeX - p.x;
            var dy = p.homeY - p.y;
            p.vx += dx * 0.003;
            p.vy += dy * 0.003;

            if (mouse.active) {
                var repRadius = 10000 * driftScale * driftScale;
                var repForce = 2 * driftScale;
                var mdx = p.x - mouse.x;
                var mdy = p.y - mouse.y;
                var mdist = mdx * mdx + mdy * mdy;
                if (mdist < repRadius) {
                    var force = (1 - mdist / repRadius) * repForce;
                    var ang = Math.atan2(mdy, mdx);
                    p.vx += Math.cos(ang) * force;
                    p.vy += Math.sin(ang) * force;
                }
            }

            // Wind drift: scatter particles on the right side (desktop only — disabled on mobile for legibility)
            if (driftScale >= 1) {
                p.phase += 0.01;
                var drift = p.scatter * (1 + Math.sin(p.phase) * 0.3);
                p.vx += drift * 0.15;
                p.vy -= drift * 0.08;
            }

            p.vx *= 0.92;
            p.vy *= 0.92;

            p.x += p.vx;
            p.y += p.vy;

            var distFromHome = Math.abs(p.x - p.homeX);
            var fadeAlpha = Math.max(0.15, 1 - distFromHome / (W * 0.3));

            // Color: white core, blending toward slate for scattered edges
            if (distFromHome > 40) {
                var blend = Math.min(1, distFromHome / 120);
                var r = Math.round(WHITE[0] * (1 - blend) + SLATE[0] * blend);
                var g = Math.round(WHITE[1] * (1 - blend) + SLATE[1] * blend);
                var b = Math.round(WHITE[2] * (1 - blend) + SLATE[2] * blend);
                ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (fadeAlpha * 0.6) + ')';
            } else {
                ctx.fillStyle = 'rgba(255, 255, 255, ' + fadeAlpha + ')';
            }

            ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        if (running) rafId = requestAnimationFrame(draw);
    }
    var rafId = null;
    var running = false;

    function start() {
        if (running) return;
        running = true;
        rafId = requestAnimationFrame(draw);
    }

    function stop() {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
    }

    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) start(); else stop();
        }, { threshold: 0 });
        io.observe(hero);
    }

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) stop();
        else if (hero.getBoundingClientRect().bottom > 0 && hero.getBoundingClientRect().top < window.innerHeight) start();
    });

    hero.addEventListener('mousemove', function (e) {
        var rect = hero.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
        mouse.active = true;
    });
    hero.addEventListener('mouseleave', function () {
        mouse.active = false;
        mouse.x = -9999;
        mouse.y = -9999;
    });

    hero.addEventListener('touchmove', function (e) {
        var rect = hero.getBoundingClientRect();
        var touch = e.touches[0];
        mouse.x = touch.clientX - rect.left;
        mouse.y = touch.clientY - rect.top;
        mouse.active = true;
    }, { passive: true });
    hero.addEventListener('touchend', function () {
        mouse.active = false;
    });

    resize();
    var resizeTimer;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 200);
    });

    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
            resize();
            if (reduced) { start(); stop(); }
            else start();
        });
    } else {
        if (reduced) { start(); stop(); } else start();
    }
})();
</script>
